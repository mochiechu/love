<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Kamu Sayang Aku? 🥺</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --pink:#ffc9de;
    --pink-deep:#ff7fb4;
    --lavender:#d9c9ff;
    --peach:#ffe0c2;
    --cream:#fff8f3;
    --plum:#5a4463;
    --plum-soft:#8b7893;
    --white:#ffffff;
    --shadow: 0 18px 40px -12px rgba(120, 70, 110, 0.35);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    overflow-x:hidden;
  }

  body{
    font-family:'Nunito', sans-serif;
    color:var(--plum);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,201,222,.9), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(217,201,255,.85), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(255,224,194,.9), transparent 55%),
      var(--cream);
    background-attachment: fixed;
    position:relative;
  }

  /* bintik-bintik dekorasi mengambang biar suasana makin lucu */
  .floaty{
    position:fixed;
    font-size:28px;
    opacity:.55;
    pointer-events:none;
    animation: floatUpDown 6s ease-in-out infinite;
    user-select:none;
    z-index:0;
  }
  .floaty.f1{ top:10%; left:8%; animation-delay:0s; }
  .floaty.f2{ top:75%; left:12%; animation-delay:1.2s; font-size:22px; }
  .floaty.f3{ top:20%; right:10%; animation-delay:.6s; font-size:24px; }
  .floaty.f4{ bottom:12%; right:14%; animation-delay:1.8s; }
  @keyframes floatUpDown{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-18px) rotate(8deg); }
  }

  .card{
    position:relative;
    z-index:1;
    background: var(--white);
    border-radius: 32px;
    padding: 40px clamp(24px, 6vw, 56px) 44px;
    max-width: 480px;
    width:100%;
    text-align:center;
    box-shadow: var(--shadow);
    border: 3px solid rgba(255,255,255,.6);
    outline: 6px solid rgba(255, 201, 222, .35);
  }

  .illustration{
    width: clamp(120px, 30vw, 160px);
    margin: -12px auto 8px;
    animation: bounceIdle 3.2s ease-in-out infinite;
  }
  @keyframes bounceIdle{
    0%,100%{ transform: translateY(0) rotate(-2deg); }
    50%{ transform: translateY(-10px) rotate(2deg); }
  }

  .title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(1.7rem, 5vw, 2.4rem);
    color: var(--plum);
    margin: 4px 0 6px;
    letter-spacing: .3px;
  }

  .subtitle{
    font-size: .98rem;
    color: var(--plum-soft);
    margin: 0 0 28px;
    font-weight:600;
  }

  .button-row{
    display:flex;
    gap:16px;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    min-height: 70px;
  }

  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 1.05rem;
    border:none;
    border-radius: 999px;
    padding: 15px 30px;
    cursor:pointer;
    transition: transform .18s ease, box-shadow .18s ease, background .25s ease, left .35s cubic-bezier(.34,1.56,.64,1), top .35s cubic-bezier(.34,1.56,.64,1);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .btn-iya{
    background: linear-gradient(135deg, var(--pink-deep), #ff5ea3);
    color:#fff;
    box-shadow: 0 10px 20px -6px rgba(255, 94, 163, .55);
    position: relative;
    z-index: 40;
    will-change: left, top, transform;
  }
  .btn-iya:hover{ transform: scale(1.04); }

  .btn-iya.is-fleeing{
    position: fixed;
    z-index: 999;
  }

  .btn-tidak{
    background: linear-gradient(135deg, var(--lavender), #b9a4f5);
    color: var(--plum);
    box-shadow: 0 10px 20px -6px rgba(180, 150, 245, .5);
    transform: scale(var(--tidak-scale, 1));
  }
  .btn-tidak:active{ transform: scale(calc(var(--tidak-scale, 1) * .94)); }

  .hint{
    margin-top: 18px;
    font-size: .82rem;
    color: var(--plum-soft);
    opacity: .8;
    font-weight:600;
  }

  /* ===== Overlay sukses ===== */
  .success-overlay{
    position: fixed;
    inset:0;
    background: rgba(90, 68, 99, .35);
    backdrop-filter: blur(4px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 1000;
    padding: 20px;
    opacity:0;
    pointer-events:none;
    transition: opacity .35s ease;
  }
  .success-overlay.show{ opacity:1; pointer-events:auto; }

  .success-card{
    background: var(--white);
    border-radius: 28px;
    padding: 36px 32px;
    text-align:center;
    max-width: 380px;
    width:100%;
    box-shadow: var(--shadow);
    transform: scale(.8) translateY(20px);
    transition: transform .4s cubic-bezier(.34,1.56,.64,1);
  }
  .success-overlay.show .success-card{ transform: scale(1) translateY(0); }

  .success-emoji{ font-size: 3rem; margin: 0 0 6px; }

  .success-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: 1.5rem;
    color: var(--plum);
    margin: 0 0 8px;
  }

  .success-sub{
    color: var(--plum-soft);
    font-weight:600;
    font-size: .95rem;
    margin: 0 0 24px;
  }

  .btn-reset{
    background: linear-gradient(135deg, var(--pink-deep), #ff5ea3);
    color:#fff;
    box-shadow: 0 10px 20px -6px rgba(255, 94, 163, .5);
  }
  .btn-reset:hover{ transform: scale(1.05); }

  /* ===== Confetti ===== */
  .confetti-layer{
    position: fixed;
    inset:0;
    pointer-events:none;
    z-index: 1001;
    overflow:hidden;
  }
  .confetti-piece{
    position:absolute;
    top:-20px;
    border-radius: 3px;
    opacity: .95;
    animation-name: confettiFall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes confettiFall{
    0%{ transform: translateY(0) rotate(0deg); opacity:1; }
    100%{ transform: translateY(105vh) rotate(720deg); opacity:.9; }
  }

  @media (max-width: 420px){
    .card{ padding: 32px 20px 36px; border-radius: 26px; }
    .btn{ padding: 13px 24px; font-size: .98rem; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .1s !important; }
  }
</style>
</head>
<body>

  <!-- dekorasi mengambang -->
  <span class="floaty f1">💕</span>
  <span class="floaty f2">✨</span>
  <span class="floaty f3">🌸</span>
  <span class="floaty f4">💫</span>

  <main class="card">
    <div class="illustration" aria-hidden="true">
      <!-- ilustrasi beruang lucu tersipu -->
      <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="175" rx="55" ry="10" fill="#ffd9ea" opacity=".6"/>
        <circle cx="46" cy="55" r="26" fill="#f5c9a0"/>
        <circle cx="154" cy="55" r="26" fill="#f5c9a0"/>
        <circle cx="46" cy="55" r="13" fill="#ffd9b8"/>
        <circle cx="154" cy="55" r="13" fill="#ffd9b8"/>
        <circle cx="100" cy="105" r="72" fill="#f9d5ad"/>
        <circle cx="65" cy="130" r="15" fill="#ffb6c9" opacity=".8"/>
        <circle cx="135" cy="130" r="15" fill="#ffb6c9" opacity=".8"/>
        <path d="M75 95 Q82 85 89 95" stroke="#5a4463" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M111 95 Q118 85 125 95" stroke="#5a4463" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="100" cy="112" rx="12" ry="9" fill="#5a4463"/>
        <path d="M100 121 Q100 130 92 132" stroke="#5a4463" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M82 140 Q100 152 118 140" stroke="#5a4463" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M40 90 Q10 100 22 130" stroke="#5a4463" stroke-width="0" fill="none"/>
      </svg>
    </div>

    <h1 class="title">km sayang ak g? kalo ga denda 100 jt</h1>
    <p class="subtitle"></p>

    <div class="button-row">
      <button id="btnIya" class="btn btn-iya" type="button">syng bgt pake bgt</button>
      <button id="btnTidak" class="btn btn-tidak" type="button">G (denda 100jt)</button>
    </div>

    <p class="hint" id="hintText"></p>
  </main>

  <div class="confetti-layer" id="confettiLayer"></div>

  <div class="success-overlay" id="successOverlay">
    <div class="success-card">
      <p class="success-emoji">😢</p>
      <h2 class="success-title">jahat,gbecus. denda 200jt sm es teler</h2>
      <p class="success-sub"></p>
      <button id="btnReset" class="btn btn-reset" type="button">gausa main lg,becus't</button>
    </div>
  </div>

<script>
(function () {
  var btnIya   = document.getElementById('btnIya');
  var btnTidak = document.getElementById('btnTidak');
  var overlay  = document.getElementById('successOverlay');
  var confettiLayer = document.getElementById('confettiLayer');
  var hintText = document.getElementById('hintText');
  var btnReset = document.getElementById('btnReset');

  var DODGE_RADIUS = 110;   // jarak (px) mulai kabur saat kursor mendekat
  var MOVE_COOLDOWN = 260;  // jeda minimum antar-perpindahan (ms)
  var TIDAK_STEP = 1;    // penambahan skala tombol Tidak tiap kali Iya kabur
  var TIDAK_MAX = 20;      // batas maksimum skala tombol Tidak

  var lastMove = 0;
  var tidakScale = 1;
  var gameOver = false;
  var dodgeCount = 0;

  function setTidakScale(scale) {
    tidakScale = Math.min(TIDAK_MAX, scale);
    btnTidak.style.setProperty('--tidak-scale', tidakScale.toFixed(3));
  }

  function randomPosition() {
    var margin = 16;
    var w = btnIya.offsetWidth  || 140;
    var h = btnIya.offsetHeight || 54;
    var maxX = Math.max(margin, window.innerWidth  - w - margin);
    var maxY = Math.max(margin, window.innerHeight - h - margin);
    var x = margin + Math.random() * (maxX - margin);
    var y = margin + Math.random() * (maxY - margin);
    return { x: x, y: y };
  }

  function fleeIya() {
    if (gameOver) return;
    var now = Date.now();
    if (now - lastMove < MOVE_COOLDOWN) return;
    lastMove = now;

    if (!btnIya.classList.contains('is-fleeing')) {
      btnIya.classList.add('is-fleeing');
    }

    var pos = randomPosition();
    btnIya.style.left = pos.x + 'px';
    btnIya.style.top  = pos.y + 'px';

    dodgeCount++;
    setTidakScale(1 + dodgeCount * TIDAK_STEP);

    if (dodgeCount === 1) {
      hintText.textContent = '';
    } else if (dodgeCount === 6) {
      hintText.textContent = '';
    }
  }

  // Kursor mendekat -> kabur (desktop)
  document.addEventListener('mousemove', function (e) {
    if (gameOver) return;
    var rect = btnIya.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    if (dist < DODGE_RADIUS) fleeIya();
  });

  // Fallback: hover / fokus langsung kabur juga
  btnIya.addEventListener('mouseenter', fleeIya);
  btnIya.addEventListener('focus', fleeIya);

  // Fallback untuk layar sentuh: begitu disentuh, langsung kabur, tap dibatalkan
  btnIya.addEventListener('touchstart', function (e) {
    e.preventDefault();
    fleeIya();
  }, { passive: false });

  // Jaga-jaga kalau tetap "berhasil" diklik (mis. via keyboard) -> tetap kabur, tidak dianggap menjawab
  btnIya.addEventListener('click', function (e) {
    e.preventDefault();
    fleeIya();
  });

  // Reposisi ulang saat resize supaya tombol tidak nyangkut di luar layar
  window.addEventListener('resize', function () {
    if (btnIya.classList.contains('is-fleeing') && !gameOver) {
      var pos = randomPosition();
      btnIya.style.left = pos.x + 'px';
      btnIya.style.top  = pos.y + 'px';
    }
  });

  function launchConfetti() {
    var colors = ['#ff7fb4', '#ffc9de', '#b9a4f5', '#ffd9b8', '#a0e7c8', '#ffe0c2'];
    var pieces = 90;
    for (var i = 0; i < pieces; i++) {
      var el = document.createElement('div');
      el.className = 'confetti-piece';
      var size = 6 + Math.random() * 8;
      el.style.width = size + 'px';
      el.style.height = (size * (0.5 + Math.random() * 0.7)) + 'px';
      el.style.left = (Math.random() * 100) + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      var duration = 2.4 + Math.random() * 1.8;
      var delay = Math.random() * 0.4;
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = delay + 's';
      confettiLayer.appendChild(el);
      (function (node, life) {
        setTimeout(function () { node.remove(); }, life * 1000 + 500);
      })(el, duration + delay);
    }
  }

  btnTidak.addEventListener('click', function () {
    gameOver = true;
    launchConfetti();
    overlay.classList.add('show');
  });

  btnReset.addEventListener('click', function () {
    overlay.classList.remove('show');
    gameOver = false;
    dodgeCount = 0;
    setTidakScale(1);
    hintText.textContent = 'pencet aja';
    btnIya.classList.remove('is-fleeing');
    btnIya.style.left = '';
    btnIya.style.top = '';
  });
})();
</script>
</body>
</html>
